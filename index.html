<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171e">
  <title>BDC Statistik</title>
  <link rel="icon" href="ikon-192.png?v=0.4.1" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BDC">
  <link rel="stylesheet" href="style.css?v=0.4.1">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Till turneringarna">
      <img src="ikon-192.png?v=0.4.1" alt="" class="logo" aria-hidden="true"><span>BDC Statistik</span>
    </a>
    <nav class="tabs" aria-label="Huvudmeny">
      <a href="#/" data-route="turneringar">Turneringar</a>
      <a href="#/spelare" data-route="spelare">Spelare</a>
      <a href="#/cuper" data-route="cuper">Cuper</a>
      <a href="#/admin" data-route="admin" id="adminlank" hidden>Admin</a>
      <a href="#/nyheter" data-route="nyheter" class="info" title="Nytt i appen" aria-label="Nytt i appen">i</a>
    </nav>
  </header>

  <main id="app" aria-live="polite">
    <p class="muted center">Laddar …</p>
  </main>

  <footer class="foot">
    <button type="button" class="btn installera" id="installera" hidden>Installera som app</button>
    <span id="version">v0.4.1</span> · Data från <a href="https://n01darts.com/" target="_blank" rel="noopener">n01darts.com</a> · <a href="#/loggaut" id="loggaut" hidden>Logga ut</a>
  </footer>

  <script type="module" src="app.js?v=0.4.1"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    let installation = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); installation = e; document.getElementById('installera').hidden = false;
    });
    document.getElementById('installera').addEventListener('click', async () => {
      if (!installation) return;
      installation.prompt(); await installation.userChoice; installation = null;
      document.getElementById('installera').hidden = true;
    });
    window.addEventListener('appinstalled', () => { document.getElementById('installera').hidden = true; });
  </script>
</body>
</html>
